# AI Web — Hermes plugin metadata
# Architecture v2.3: session daemon + client, TUI-safe keep-alive,
# V1 capture (fill + network sniff), final-only inject, safe /aiweb-write.

name: aiweb
version: "2.3.0"
description: >
  Grok via real Chrome (Playwright/CDP) owned by a session daemon for
  hermes --tui and CLI. Keep-alive browser, large-answer disk+chunk,
  final-only model inject, and safe /aiweb-write.

author: local
protocol_version: 1

entry: __init__.py

config:
  RESPONSE_DEFAULT_SIZE:
    env: HERMES_AIWEB_RESPONSE_DEFAULT_SIZE
    default: 2000
    description: Max chars for "small" path (no chat chunking)
  MODEL_PACK_CAP:
    env: HERMES_AIWEB_MODEL_PACK
    default: 6000
    description: Max chars injected into Hermes model context
  MAX_CAPTURE_CHARS:
    env: HERMES_AIWEB_MAX_CAPTURE_CHARS
    default: 500000
  TIMEOUT:
    env: HERMES_AIWEB_TIMEOUT
    default: 300
  IDLE_SEC:
    env: HERMES_AIWEB_IDLE_SEC
    default: 1800
  OUT_DIR:
    env: HERMES_AIWEB_OUT_DIR
    default: ""
  KEEP_ALIVE:
    env: HERMES_AIWEB_KEEP_ALIVE
    default: "1"
  WRITE_INJECT:
    env: HERMES_AIWEB_WRITE_INJECT
    default: "none"
  KEEP_ALIVE_BROWSER:
    env: HERMES_AIWEB_KEEP_ALIVE
    default: "1"

commands:
  - name: aiweb
    description: Grok research; final-only inject on next Hermes turn
  - name: aiweb-chat
    description: Grok research; no model inject
  - name: aiweb-write
    description: Grok → file under out dir (no full-body inject)
  - name: aiweb-more
    description: Next chunk of last large response
  - name: aiweb-login
    description: Headed login / refresh session (browser stays up)
  - name: aiweb-stop
    description: Close browser session (optional --daemon)
  - name: aiweb-status
    description: Daemon/browser/inject pending status
  - name: aiweb-clear-model
    description: Clear inject buffer and sticky flag
  - name: aiweb-keep-model
    description: Make inject sticky until clear (still capped)
  - name: aiweb-run
    description: Ask Grok for runnable Python (no local exec in 2.3.0)
  - name: aiweb-load
    description: Send hot memory into current Grok tab
  - name: aiweb-reset
    description: Reset hot/archive memory and inject buffer
  - name: aiweb-summary
    description: Append a short memory summary

notes:
  - Browser is owned by the AI Web daemon, not the TUI slash worker.
  - Inject applies on the next agent LLM call (pre_llm_call), not inside slash.
  - Automating Grok/x.com may violate ToS — personal use at your own risk.e